<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RM Ubuzima Icon Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
    canvas { border: 1px solid #ccc; margin: 10px; }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
    .icon-item { text-align: center; }
    button { padding: 10px 20px; background: #2A9D8F; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #0F766E; }
  </style>
</head>
<body>
  <h1>RM Ubuzima - Icon Generator</h1>
  <p>This page generates PNG icons from the SVG source. Click "Generate All" to download all icon sizes.</p>
  <button onclick="generateAll()">Generate All Icons</button>
  <div id="icons" class="icon-grid"></div>

  <script>
    const SIZES = [72, 96, 128, 144, 152, 192, 384, 512];
    
    const SVG_SOURCE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#2A9D8F"/>
          <stop offset="100%" style="stop-color:#0F766E"/>
        </linearGradient>
        <linearGradient id="heart" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#5FC8BA"/>
          <stop offset="100%" style="stop-color:#FFFFFF"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="128" fill="url(#bg)"/>
      <g transform="translate(256, 256)">
        <path d="M0,-140 C-60,-120 -120,-80 -120,0 C-120,100 -60,160 0,180 C60,160 120,100 120,0 C120,-80 60,-120 0,-140 Z" 
              fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.9"/>
        <path d="M0,100 C-80,40 -110,-20 -70,-70 C-50,-95 -20,-80 0,-50 C20,-80 50,-95 70,-70 C110,-20 80,40 0,100 Z" 
              fill="url(#heart)"/>
        <path d="M-40,20 L-20,20 L-10,0 L0,30 L10,0 L20,20 L40,20" 
              fill="none" stroke="#2A9D8F" stroke-width="6" stroke-linecap="round"/>
        <text x="0" y="-90" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">RM</text>
      </g>
      <circle cx="80" cy="120" r="12" fill="#5FC8BA" opacity="0.6"/>
      <circle cx="432" cy="120" r="12" fill="#5FC8BA" opacity="0.6"/>
      <circle cx="80" cy="392" r="8" fill="#5FC8BA" opacity="0.4"/>
      <circle cx="432" cy="392" r="8" fill="#5FC8BA" opacity="0.4"/>
    </svg>`;

    function generateIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      const img = new Image();
      const svgBlob = new Blob([SVG_SOURCE], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(svgBlob);
      
      img.onload = () => {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
        
        const dataUrl = canvas.toDataURL('image/png');
        const container = document.getElementById('icons');
        const item = document.createElement('div');
        item.className = 'icon-item';
        item.innerHTML = `
          <canvas id="canvas-${size}" width="${size}" height="${size}"></canvas>
          <p>${size}x${size}</p>
          <a href="${dataUrl}" download="icon-${size}x${size}.png">Download</a>
        `;
        container.appendChild(item);
        
        const displayCanvas = item.querySelector('canvas');
        displayCanvas.getContext('2d').drawImage(img, 0, 0, size, size);
      };
      
      img.src = url;
    }

    function generateAll() {
      document.getElementById('icons').innerHTML = '';
      SIZES.forEach(size => generateIcon(size));
    }

    // Auto-generate on load
    window.onload = generateAll;
  </script>
</body>
</html>

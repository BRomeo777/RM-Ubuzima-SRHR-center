<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RM Ubuzima - PWA Icon Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: white;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #2A9D8F, #1D7A6E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #888;
      margin-bottom: 30px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 30px;
      max-width: 800px;
      width: 100%;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .icon-item {
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s;
    }
    .icon-item:hover { transform: translateY(-5px); }
    .icon-item img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .icon-item span {
      font-size: 12px;
      color: #aaa;
    }
    button {
      background: linear-gradient(135deg, #2A9D8F, #1D7A6E);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(42,157,143,0.3);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .instructions {
      margin-top: 30px;
      padding: 20px;
      background: rgba(42,157,143,0.1);
      border-radius: 12px;
      border-left: 4px solid #2A9D8F;
    }
    .instructions h3 {
      margin-bottom: 10px;
      color: #2A9D8F;
    }
    .instructions ol {
      margin-left: 20px;
      line-height: 1.8;
      color: #aaa;
    }
    .instructions code {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(34,197,94,0.1);
      color: #22c55e;
    }
    .status.error {
      display: block;
      background: rgba(239,68,68,0.1);
      color: #ef4444;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <h1>RM Ubuzima</h1>
  <p>PWA Icon Generator - Create all required icon sizes</p>
  
  <div class="container">
    <div class="preview-grid" id="previewGrid"></div>
    
    <button id="generateBtn" onclick="generateAllIcons()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download All Icons
    </button>
    
    <div id="status" class="status"></div>
    
    <div class="instructions">
      <h3>📋 Instructions</h3>
      <ol>
        <li>Make sure your logo is saved as <code>public/logo.png</code></li>
        <li>Click "Download All Icons" button above</li>
        <li>Extract the downloaded ZIP file</li>
        <li>Copy all PNG files to <code>public/icons/</code> folder</li>
        <li>Build and deploy your app</li>
      </ol>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    const SIZES = [72, 96, 128, 144, 152, 192, 384, 512];
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Create gradient background
    function createGradient(size) {
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#2A9D8F');
      gradient.addColorStop(1, '#1D7A6E');
      return gradient;
    }

    // Draw rounded rect
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // Draw heart shape
    function drawHeart(x, y, size) {
      const topCurveHeight = size * 0.3;
      ctx.beginPath();
      ctx.moveTo(x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + size, x + size / 2, y + size);
      ctx.bezierCurveTo(x + size / 2, y + size, x + size, y + (size + topCurveHeight) / 2, x + size, y + topCurveHeight);
      ctx.bezierCurveTo(x + size, y, x + size / 2, y, x + size / 2, y + topCurveHeight);
      ctx.closePath();
      ctx.fill();
    }

    // Load logo image
    let logoImage = null;
    
    function loadLogo() {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          logoImage = img;
          resolve(img);
        };
        img.onerror = () => {
          reject(new Error('Failed to load logo.png. Make sure it exists in the public folder.'));
        };
        img.src = '/logo.png';
      });
    }

    // Generate icon from logo
    function generateIcon(size) {
      canvas.width = size;
      canvas.height = size;
      
      // Clear
      ctx.clearRect(0, 0, size, size);
      
      if (logoImage) {
        // Draw logo with padding
        const padding = size * 0.1;
        const drawSize = size - (padding * 2);
        ctx.drawImage(logoImage, padding, padding, drawSize, drawSize);
      } else {
        // Fallback gradient
        ctx.fillStyle = createGradient(size);
        ctx.fillRect(0, 0, size, size);
      }
      
      return canvas.toDataURL('image/png');
    }

    // Generate maskable icon
    function generateMaskableIcon(size) {
      return generateIcon(size); // Same as regular icon for logo
    }

    // Generate shortcut icon
    function generateShortcutIcon(size, color, text) {
      canvas.width = size;
      canvas.height = size;
      
      ctx.clearRect(0, 0, size, size);
      
      // Background
      ctx.fillStyle = color;
      roundRect(0, 0, size, size, size * 0.2);
      ctx.fill();
      
      // Text
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.5}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, size / 2, size / 2);
      
      return canvas.toDataURL('image/png');
    }

    // Preview grid
    async function createPreview() {
      const grid = document.getElementById('previewGrid');
      
      try {
        await loadLogo();
      } catch (e) {
        console.log('Logo not loaded, using fallback');
      }
      
      SIZES.forEach(size => {
        const dataUrl = generateIcon(size);
        const div = document.createElement('div');
        div.className = 'icon-item';
        div.innerHTML = `
          <img src="${dataUrl}" alt="${size}x${size}">
          <span>${size}x${size}</span>
        `;
        grid.appendChild(div);
      });
    }

    // Generate all icons and download as ZIP
    async function generateAllIcons() {
      const btn = document.getElementById('generateBtn');
      const status = document.getElementById('status');
      
      btn.disabled = true;
      btn.innerHTML = 'Loading Logo...';
      
      // Load logo first
      try {
        await loadLogo();
        btn.innerHTML = 'Generating...';
      } catch (e) {
        status.className = 'status error';
        status.textContent = '✗ Error: logo.png not found. Please add your logo to the public folder first.';
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download All Icons
        `;
        return;
      }
      
      try {
        const zip = new JSZip();
        const folder = zip.folder('icons');
        
        // Main icons
        SIZES.forEach(size => {
          const dataUrl = generateIcon(size);
          const base64 = dataUrl.split(',')[1];
          folder.file(`icon-${size}x${size}.png`, base64, { base64: true });
        });
        
        // Maskable icon
        const maskableData = generateMaskableIcon(512);
        folder.file('maskable-icon-512x512.png', maskableData.split(',')[1], { base64: true });
        
        // Shortcut icons
        const shortcuts = [
          { name: 'shortcut-ai', color: '#10B981', text: 'AI' },
          { name: 'shortcut-doctor', color: '#3B82F6', text: 'Dr' },
          { name: 'shortcut-emergency', color: '#EF4444', text: '!' },
          { name: 'shortcut-girls', color: '#EC4899', text: '♀' }
        ];
        
        shortcuts.forEach(s => {
          const dataUrl = generateShortcutIcon(96, s.color, s.text);
          folder.file(`${s.name}.png`, dataUrl.split(',')[1], { base64: true });
        });
        
        // Generate and download ZIP
        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'rm-ubuzima-icons.zip';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        status.className = 'status success';
        status.textContent = '✓ All icons generated successfully! Check your downloads.';
        
      } catch (err) {
        status.className = 'status error';
        status.textContent = '✗ Error: ' + err.message;
      }
      
      btn.disabled = false;
      btn.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download All Icons
      `;
    }

    // Initialize preview
    createPreview().catch(console.error);
  </script>
</body>
</html>

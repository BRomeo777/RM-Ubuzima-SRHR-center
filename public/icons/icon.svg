<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A9D8F"/>
      <stop offset="100%" style="stop-color:#0F766E"/>
    </linearGradient>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5FC8BA"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  
  <!-- Central Heart with Shield -->
  <g transform="translate(256, 256)">
    <!-- Shield outline -->
    <path d="M0,-140 C-60,-120 -120,-80 -120,0 C-120,100 -60,160 0,180 C60,160 120,100 120,0 C120,-80 60,-120 0,-140 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.9"/>
    
    <!-- Heart -->
    <path d="M0,100 C-80,40 -110,-20 -70,-70 C-50,-95 -20,-80 0,-50 C20,-80 50,-95 70,-70 C110,-20 80,40 0,100 Z" 
          fill="url(#heartGradient)"/>
    
    <!-- Heart pulse line -->
    <path d="M-40,20 L-20,20 L-10,0 L0,30 L10,0 L20,20 L40,20" 
          fill="none" stroke="#2A9D8F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Text RM -->
    <text x="0" y="-90" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">RM</text>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="80" cy="120" r="12" fill="#5FC8BA" opacity="0.6"/>
  <circle cx="100" cy="160" r="8" fill="#5FC8BA" opacity="0.4"/>
  <circle cx="432" cy="120" r="12" fill="#5FC8BA" opacity="0.6"/>
  <circle cx="412" cy="160" r="8" fill="#5FC8BA" opacity="0.4"/>
  <circle cx="80" cy="392" r="8" fill="#5FC8BA" opacity="0.4"/>
  <circle cx="432" cy="392" r="8" fill="#5FC8BA" opacity="0.4"/>
</svg>
